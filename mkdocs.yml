site_name: UniFace Việt Nam
site_description: Thư viện Python hợp nhất cho phân tích khuôn mặt — phát hiện, nhận dạng, landmark, face mesh, tracking, parsing, gaze, thuộc tính, chất lượng và chống giả mạo.
site_author: Yakhyokhuja Valikhujaev · Bản Việt hóa bởi Base27-CVNSS
site_url: https://base27-cvnss.github.io/vi-uniface/

repo_name: Base27-CVNSS/vi-uniface
repo_url: https://github.com/Base27-CVNSS/vi-uniface
edit_uri: edit/main/docs/

copyright: >-
  UniFace © Yakhyokhuja Valikhujaev · Bản Việt hóa cộng đồng bởi Base27-CVNSS · MIT License

theme:
  name: material
  custom_dir: docs/overrides
  language: vi
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Theo giao diện hệ thống
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang giao diện sáng
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - announce.dismiss
    - toc.follow
  icon:
    logo: material/face-recognition
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Base27-CVNSS/vi-uniface
      name: Kho mã Việt hóa
    - icon: fontawesome/brands/github-alt
      link: https://github.com/yakhyo/uniface
      name: Dự án UniFace gốc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/uniface/
      name: UniFace trên PyPI

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search:
      lang: vi
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      locale: vi

nav:
  - Trang chủ: index.md
  - Bắt đầu:
      - Cài đặt: installation.md
      - Khởi động nhanh: quickstart.md
      - Notebook tương tác: notebooks.md
      - Kho mô hình: models.md
      - Bộ dữ liệu: datasets.md
  - Hướng dẫn thực hành:
      - Pipeline ảnh: recipes/image-pipeline.md
      - Video & Webcam: recipes/video-webcam.md
      - Tìm kiếm khuôn mặt: recipes/face-search.md
      - Xử lý hàng loạt: recipes/batch-processing.md
      - Ẩn danh luồng video: recipes/anonymize-stream.md
      - Mô hình tùy chỉnh: recipes/custom-models.md
  - Tham chiếu API:
      - Phát hiện khuôn mặt: modules/detection.md
      - Nhận dạng khuôn mặt: modules/recognition.md
      - Theo dõi khuôn mặt: modules/tracking.md
      - Landmark & Face Mesh: modules/landmarks.md
      - Thuộc tính khuôn mặt: modules/attributes.md
      - Phân vùng khuôn mặt: modules/parsing.md
      - Tách nền chân dung: modules/matting.md
      - Ước lượng hướng nhìn: modules/gaze.md
      - Tư thế đầu 3D: modules/headpose.md
      - Chống giả mạo: modules/spoofing.md
      - Chất lượng khuôn mặt: modules/quality.md
      - Quyền riêng tư: modules/privacy.md
      - Kho vector: modules/stores.md
  - Kiến trúc & nguyên lý:
      - Tổng quan kiến trúc: concepts/overview.md
      - Dữ liệu vào & ra: concepts/inputs-outputs.md
      - Hệ tọa độ: concepts/coordinate-systems.md
      - Bộ thực thi phần cứng: concepts/execution-providers.md
      - Bộ nhớ đệm mô hình: concepts/model-cache-offline.md
      - Ngưỡng & hiệu chuẩn: concepts/thresholds-calibration.md
  - Tài nguyên:
      - Đóng góp: contributing.md
      - Giấy phép & ghi công: license-attribution.md
      - Nguồn gốc dự án: upstream.md
      - Phiên bản gốc: https://github.com/yakhyo/uniface/releases
      - Thảo luận upstream: https://github.com/yakhyo/uniface/discussions
